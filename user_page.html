<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabaseAnonKey = 'sb_publishable_cvdFFXogk21bVDZqJf3Dpg_u3VFZypd';

const urlParams = new URLSearchParams(window.location.search);
const userCode = urlParams.get('code');

// State trackers for animation triggers

let previousHatchedState = null;

const petBadge = document.getElementById('petBadge');
const petName = document.getElementById('petName');
const petDetails = document.getElementById('petDetails');
const progressLabel = document.getElementById('progressLabel');
const progressText = document.getElementById('progressText');
const progressBar = document.getElementById('progressBar');

const petSpeciesSelect = document.getElementById('petSpeciesSelect');
const templatePreview = document.getElementById('templatePreview');
const typeTemplate = document.getElementById('typeTemplate');
const typeCanvas = document.getElementById('typeCanvas');
const templateSelectionArea = document.getElementById('templateSelectionArea');
const canvasSelectionArea = document.getElementById('canvasSelectionArea');

// Canvas & Tools Elements
const canvas = document.getElementById('pixelCanvas');
const ctx = canvas ? canvas.getContext('2d') : null;
const brushColor = document.getElementById('brushColor');
const penModeBtn = document.getElementById('penModeBtn');
const eraserModeBtn = document.getElementById('eraserModeBtn');
const brushSizeSelect = document.getElementById('brushSizeSelect');
const clearCanvasBtn = document.getElementById('clearCanvasBtn');

// Pet Image Map
const petImageMap = {
  egg: 'pictures/egg.png',
  cat: 'pictures/cat.png',
  dog: 'pictures/dog.png'
};

// Custom Cursor
if (canvas) {
  canvas.style.cursor = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><rect x="7" y="0" width="2" height="16" fill="black"/><rect x="0" y="7" width="16" height="2" fill="black"/></svg>') 8 8, crosshair`;
}

// Template Select & Live Preview
if (petSpeciesSelect && templatePreview) {
  petSpeciesSelect.addEventListener('change', (e) => {
    const selectedSpecies = e.target.value;
    templatePreview.src = petImageMap[selectedSpecies] || petImageMap.egg;
  });
}

// Creation Mode Toggle
if (typeTemplate && typeCanvas) {
  typeTemplate.addEventListener('change', () => {
    templateSelectionArea.classList.remove('hidden');
    canvasSelectionArea.classList.add('hidden');
  });

  typeCanvas.addEventListener('change', () => {
    templateSelectionArea.classList.add('hidden');
    canvasSelectionArea.classList.remove('hidden');
    renderCanvas();
  });
}

// Canvas Engine Settings & State Matrix
const GRID_SIZE = 64;
const PIXEL_SIZE = canvas ? canvas.width / GRID_SIZE : 0;
let pixelMatrix = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill('#ffffff'));
let isDrawing = false;
let currentTool = 'pen';
let lastGridX = null;
let lastGridY = null;

// Tool Mode Listeners
if (penModeBtn && eraserModeBtn) {
  penModeBtn.addEventListener('click', () => {
    currentTool = 'pen';
    penModeBtn.className = 'px-2 py-1 text-xs bg-sky-600 text-white font-bold rounded';
    eraserModeBtn.className = 'px-2 py-1 text-xs bg-slate-200 hover:bg-slate-300 rounded';
  });

  eraserModeBtn.addEventListener('click', () => {
    currentTool = 'eraser';
    eraserModeBtn.className = 'px-2 py-1 text-xs bg-sky-600 text-white font-bold rounded';
    penModeBtn.className = 'px-2 py-1 text-xs bg-slate-200 hover:bg-slate-300 rounded';
  });
}

if (brushColor) {
  brushColor.addEventListener('input', () => {
    currentTool = 'pen';
    if (penModeBtn && eraserModeBtn) {
      penModeBtn.className = 'px-2 py-1 text-xs bg-sky-600 text-white font-bold rounded';
      eraserModeBtn.className = 'px-2 py-1 text-xs bg-slate-200 hover:bg-slate-300 rounded';
    }
  });
}

// Color Palette Preset Selection
document.querySelectorAll('.color-preset').forEach((btn) => {
  btn.addEventListener('click', (e) => {
    const selectedColor = e.target.getAttribute('data-color');
    if (brushColor) {
      brushColor.value = selectedColor;
    }
    currentTool = 'pen';
    if (penModeBtn && eraserModeBtn) {
      penModeBtn.className = 'px-2 py-1 text-xs bg-sky-600 text-white font-bold rounded';
      eraserModeBtn.className = 'px-2 py-1 text-xs bg-slate-200 hover:bg-slate-300 rounded';
    }
  });
});

// Canvas Render Function
function renderCanvas() {
  if (!ctx) return;

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#f1f5f9';
  ctx.lineWidth = 1;

  for (let i = 0; i <= GRID_SIZE; i++) {
    ctx.beginPath();
    ctx.moveTo(i * PIXEL_SIZE, 0);
    ctx.lineTo(i * PIXEL_SIZE, canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, i * PIXEL_SIZE);
    ctx.lineTo(canvas.width, i * PIXEL_SIZE);
    ctx.stroke();
  }

  for (let x = 0; x < GRID_SIZE; x++) {
    for (let y = 0; y < GRID_SIZE; y++) {
      if (pixelMatrix[x][y] !== '#ffffff') {
        ctx.fillStyle = pixelMatrix[x][y];
        ctx.fillRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE + 0.5, PIXEL_SIZE + 0.5);
      }
    }
  }
}

// Bresenham's Line Algorithm
function fillLine(x0, y0, x1, y1, fillColor, brushSize) {
  let dx = Math.abs(x1 - x0);
  let dy = Math.abs(y1 - y0);
  let sx = x0 < x1 ? 1 : -1;
  let sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;

  let updated = false;

  while (true) {
    for (let bX = 0; bX < brushSize; bX++) {
      for (let bY = 0; bY < brushSize; bY++) {
        const targetX = x0 + bX;
        const targetY = y0 + bY;

        if (targetX >= 0 && targetX < GRID_SIZE && targetY >= 0 && targetY < GRID_SIZE) {
          if (pixelMatrix[targetX][targetY] !== fillColor) {
            pixelMatrix[targetX][targetY] = fillColor;
            updated = true;
          }
        }
      }
    }

    if (x0 === x1 && y0 === y1) break;
    let e2 = 2 * err;
    if (e2 > -dy) {
      err -= dy;
      x0 += sx;
    }
    if (e2 < dx) {
      err += dx;
      y0 += sy;
    }
  }

  return updated;
}

function handleDraw(e) {
  if (!ctx) return;
  const rect = canvas.getBoundingClientRect();

  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  const mouseX = (e.clientX - rect.left) * scaleX;
  const mouseY = (e.clientY - rect.top) * scaleY;

  const currentGridX = Math.floor(mouseX / PIXEL_SIZE);
  const currentGridY = Math.floor(mouseY / PIXEL_SIZE);

  const brushSize = parseInt(brushSizeSelect ? brushSizeSelect.value : '1', 10);
  const fillColor = currentTool === 'eraser' ? '#ffffff' : brushColor.value;

  let updated = false;

  if (lastGridX === null || lastGridY === null) {
    updated = fillLine(currentGridX, currentGridY, currentGridX, currentGridY, fillColor, brushSize);
  } else {
    updated = fillLine(lastGridX, lastGridY, currentGridX, currentGridY, fillColor, brushSize);
  }

  lastGridX = currentGridX;
  lastGridY = currentGridY;

  if (updated) {
    renderCanvas();
  }
}

if (canvas) {
  canvas.addEventListener('mousedown', (e) => {
    isDrawing = true;
    lastGridX = null;
    lastGridY = null;
    handleDraw(e);
  });

  canvas.addEventListener('mousemove', (e) => {
    if (isDrawing) handleDraw(e);
  });

  window.addEventListener('mouseup', () => {
    isDrawing = false;
    lastGridX = null;
    lastGridY = null;
  });
}

if (clearCanvasBtn) {
  clearCanvasBtn.addEventListener('click', () => {
    pixelMatrix = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill('#ffffff'));
    renderCanvas();
  });
}

// EXP Helper Functions
function getReqExpForLevel(level) {
  const lvl = Number(level) || 0;
  if (lvl <= 0) return 10;
  return Math.min(lvl * 10 + 10, 100);
}

function getTotalExpForLevel(level) {
  const lvl = Number(level) || 0;
  let total = 0;
  for (let i = 0; i < lvl; i++) {
    total += getReqExpForLevel(i);
  }
  return total;
}

// User & Pet Data
function showError(msg) {
  if (errorMessageEl) {
    errorMessageEl.textContent = msg;
    errorMessageEl.classList.remove('hidden');
  }
}

async function fetchUserData() {
  if (!userCode) {
    window.location.href = 'Login.html';
    return;
  }

  if (displayUserCode) displayUserCode.textContent = userCode;

  const { data, error } = await supabase
    .from('profiles')
    .select('current_points')
    .eq('user_code', userCode)
    .maybeSingle();

  if (error || !data) {
    showError('ユーザーデータの読み込みに失敗しました。');
    return;
  }

  const myPoints = data.current_points ?? 0;
  if (userPointsEl) userPointsEl.textContent = myPoints;

  const { count } = await supabase
    .from('profiles')
    .select('*', { count: 'exact', head: true })
    .gt('current_points', myPoints);

  if (userRankEl) userRankEl.textContent = (count ?? 0) + 1;

  await fetchPetData();
}

async function fetchPetData() {
  const { data: pet, error } = await supabase
    .from('pets')
    .select('*')
    .eq('user_code', userCode)
    .maybeSingle();

  if (error) {
    console.error('Pet fetch error:', error);
    return;
  }

  if (!pet) {
    petCreationContainer.classList.remove('hidden');
    petDisplayContainer.classList.add('hidden');
  } else {
    petCreationContainer.classList.add('hidden');
    petDisplayContainer.classList.remove('hidden');
    renderPetUI(pet);
  }
}

function renderPetUI(pet) {
  if (!pet) return;

  const currentLevel = Number(pet.level) || 0;
  const isHatched = Boolean(pet.is_hatched);

  // Trigger confetti check
  if (previousLevel !== null && previousHatchedState !== null) {
    const didLevelUp = currentLevel > previousLevel;
    const didHatch = isHatched && !previousHatchedState;

    if (didLevelUp || didHatch) {
      setTimeout(() => {
        triggerPixelConfetti();
      }, 60);
    }
  }

  previousLevel = currentLevel;
  previousHatchedState = isHatched;

  if (petName) petName.textContent = pet.pet_name || '---';
  if (petDetails) petDetails.textContent = `Lv. ${currentLevel} | 総経験値: ${pet.experience || 0} pt`;

  if (!isHatched) {
    if (petImage) petImage.src = petImageMap.egg;
    if (petBadge) {
      petBadge.textContent = 'タマゴ';
      petBadge.className = 'text-xs font-bold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 z-0';
    }

    const reqExp = getReqExpForLevel(0);
    if (progressLabel) progressLabel.textContent = 'ふ化まで';
    if (progressText) progressText.textContent = `${pet.experience || 0} / ${reqExp} pt`;
    if (progressBar) progressBar.style.width = `${Math.min(((pet.experience || 0) / reqExp) * 100, 100)}%`;
    if (feedPetBtn) feedPetBtn.textContent = `孵化させる (${reqExp}pt)`;
  } else {
    if (petImage) {
      petImage.src = pet.image_data || petImageMap[pet.species] || petImageMap.egg;
    }
    if (petBadge) {
      petBadge.textContent = `Lv.${currentLevel} ${(pet.species || '').toUpperCase()}`;
      petBadge.className = 'text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 z-0';
    }

    const currentLevelBaseExp = getTotalExpForLevel(currentLevel);
    const reqExpForNextLevel = getReqExpForLevel(currentLevel);
    const currentExpInLevel = (pet.experience || 0) - currentLevelBaseExp;
    const progressPercent = Math.max(0, Math.min((currentExpInLevel / reqExpForNextLevel) * 100, 100));

    if (progressLabel) progressLabel.textContent = `次のレベル (Lv.${currentLevel + 1}) まで`;
    if (progressText) progressText.textContent = `${currentExpInLevel} / ${reqExpForNextLevel} pt`;
    if (progressBar) progressBar.style.width = `${progressPercent}%`;
    if (feedPetBtn) feedPetBtn.textContent = `ポイントを与える (${reqExpForNextLevel}pt)`;
  }
}

// Confetti Animation Engine
function triggerPixelConfetti() {
  const confettiCanvas = document.getElementById('confettiCanvas');
  if (!confettiCanvas) {
    console.error('confettiCanvas element not found in DOM.');
    return;
  }

  const confettiCtx = confettiCanvas.getContext('2d');
  const parent = confettiCanvas.parentElement;

  const width = parent.clientWidth || parent.offsetWidth || 300;
  const height = parent.clientHeight || parent.offsetHeight || 200;

  confettiCanvas.width = width;
  confettiCanvas.height = height;

  const colors = ['#f43f5e', '#3b82f6', '#eab308', '#10b981', '#a855f7', '#ec4899'];
  const particles = [];
  const particleCount = 45;

  const centerX = width / 2;
  const centerY = height / 2;

  for (let i = 0; i < particleCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 6 + 2;
    particles.push({
      x: centerX,
      y: centerY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3.5,
      size: Math.floor(Math.random() * 4) + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1,
      gravity: 0.18
    });
  }

  function animate() {
    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    let active = false;

    particles.forEach((p) => {
      if (p.alpha > 0) {
        active = true;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.alpha -= 0.02;

        confettiCtx.save();
        confettiCtx.globalAlpha = Math.max(0, p.alpha);
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
        confettiCtx.restore();
      }
    });

    if (active) {
      requestAnimationFrame(animate);
    } else {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }
  }

  animate();
}

// Form Handlers
if (createPetForm) {
  createPetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('createPetBtn');
    if (btn) btn.disabled = true;

    const petNameVal = document.getElementById('petNameInput').value;
    const isCustom = typeCanvas ? typeCanvas.checked : false;

    let speciesVal = 'custom';
    let imageDataVal = null;

    if (isCustom && canvas) {
      imageDataVal = canvas.toDataURL('image/png');
    } else if (petSpeciesSelect) {
      speciesVal = petSpeciesSelect.value;
    }

    const { error } = await supabase.from('pets').insert([
      {
        user_code: userCode,
        pet_name: petNameVal,
        species: speciesVal,
        color: 'default',
        image_data: imageDataVal,
        level: 0,
        experience: 0,
        is_hatched: false
      }
    ]);

    if (btn) btn.disabled = false;

    if (error) {
      alert('ペットの作成に失敗しました: ' + error.message);
    } else {
      await fetchPetData();
    }
  });
}

if (feedPetBtn) {
  feedPetBtn.addEventListener('click', async () => {
    feedPetBtn.disabled = true;
    if (feedMsg) feedMsg.textContent = '処理中...';

    const { data, error } = await supabase.rpc('feed_pet', {
      p_user_code: userCode,
      p_points_to_feed: 10
    });

    feedPetBtn.disabled = false;

    if (error) {
      if (feedMsg) feedMsg.textContent = 'エラーが発生しました: ' + error.message;
      return;
    }

    if (data.status === 'success') {
      if (feedMsg) feedMsg.textContent = data.message;
      await fetchUserData();
    } else {
      if (feedMsg) feedMsg.textContent = data.message;
    }
  });
}

const menuButton = document.getElementById('menuButton');
if (menuButton) {
  menuButton.addEventListener('click', () => {
    const mobileMenu = document.getElementById('mobileMenu');
    if (mobileMenu) mobileMenu.classList.toggle('hidden');
  });
}

// Initialize Page Data
fetchUserData();
